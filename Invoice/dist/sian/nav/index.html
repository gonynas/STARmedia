<!-- 시안 고르기 막대: 프로그램이 아니라 시안을 비교하는 도구예요 -->
<div class="pick" role="toolbar" aria-label="시안 고르기">
  <div class="pick-g" aria-label="화면">
    <button type="button" data-s="items" class="on">품목·세트</button>
    <button type="button" data-s="list">발행 목록</button>
    <button type="button" data-s="rule">메뉴 규칙</button>
    <button type="button" data-s="icon">앱 아이콘</button>
  </div>
  <div class="pick-g" aria-label="보기">
    <button type="button" data-view="new" class="on">새 규칙</button>
    <button type="button" data-view="old">지금(v1.6.1)</button>
  </div>
  <div class="pick-g" aria-label="작은 항목 표시">
    <button type="button" data-mk="tree" class="on">└ 줄</button>
    <button type="button" data-mk="dot">· 점</button>
  </div>
</div>
<div id="app"></div>
<script src="nav.js?v=mwybfj92"></script>
